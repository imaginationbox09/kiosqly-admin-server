<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiosqly Admin Hub</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#16334e}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#dceeff,transparent 32%),linear-gradient(135deg,#eef4fa,#dce8f3)}.login{width:min(100%,440px);padding:34px;background:#fff;border:1px solid #e1eaf1;border-radius:22px;box-shadow:0 24px 60px #173b5a24}.identity{display:flex;align-items:center;gap:14px;margin-bottom:25px}.logo{width:56px;height:56px;object-fit:contain;border-radius:15px;padding:4px;background:#123653}.identity h1{font-size:21px;letter-spacing:-.03em;margin:0}.identity p{margin:4px 0 0;color:#708399;font-size:13px}.heading{font-size:18px;margin:0 0 7px}.intro{margin:0 0 24px;color:#63788e;font-size:14px}.field{display:grid;gap:7px;margin-bottom:17px}.field label{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.06em;color:#5d7289}.field input{height:46px;border:1px solid #d9e3ec;border-radius:9px;padding:10px 12px;font:inherit}.field input:focus{outline:3px solid #2d81d633;border-color:#2d81d6}.submit{width:100%;height:46px;border:0;border-radius:9px;background:#1976d2;color:#fff;font:inherit;font-weight:750;cursor:pointer}.error{padding:11px 12px;margin-bottom:17px;border-radius:8px;background:#fff0ef;color:#a83228;font-size:14px}
</style></head><body><main class="login"><div class="identity"><img class="logo" src="https://kiosqly.com/wp-content/uploads/2026/07/Logo-2.png" alt="Kiosqly"><div><h1>Kiosqly Admin Hub</h1><p>Gestión centralizada de flota</p></div></div><h2 class="heading">Bienvenido</h2><p class="intro">Ingresa con tus credenciales para administrar tus dispositivos.</p>{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}<form method="post" autocomplete="on"><div class="field"><label for="username">Usuario</label><input id="username" name="username" type="email" required autofocus autocomplete="username"></div><div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" required autocomplete="current-password"></div><button class="submit" type="submit">Ingresar al panel</button></form></main></body></html>
