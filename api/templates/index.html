<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flota Kiosqly</title><style>
:root{font-family:system-ui,sans-serif;color:#172033;background:#f4f7fb}body{margin:0}.top{padding:16px 5vw;background:#102a43;color:#fff;display:flex;justify-content:space-between;align-items:center}.controls,.actions{display:flex;gap:8px;flex-wrap:wrap}.controls{padding:16px 5vw;background:#fff}select,input,button{padding:9px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}button{cursor:pointer;background:#1976d2;color:#fff;border:0}.danger{background:#b42318}.secondary{background:#475569}main{padding:0 5vw 32px;overflow:auto}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top;font-size:.9rem}th{white-space:nowrap}.online{color:#087443}.offline{color:#b42318}.muted{color:#64748b}dialog{border:0;border-radius:10px;width:min(480px,90vw);box-shadow:0 16px 50px #0005}dialog form{display:grid;gap:12px}dialog::backdrop{background:#0008}.media{max-width:100%;max-height:70vh}a{color:#0b63ce}@media(max-width:900px){th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6){display:none}}</style></head>
<body><header class="top"><strong>Kiosqly · Gestión de flota</strong><form method="post" action="/logout"><button class="secondary">Salir</button></form></header><section class="controls"><select id="business"><option value="">Todos los negocios</option></select><select id="location"><option value="">Todas las sucursales</option></select><input id="search" placeholder="Buscar dispositivo"><button onclick="loadDevices()">Filtrar</button><span id="count" class="muted"></span></section><main><table><thead><tr><th>Dispositivo</th><th>Negocio / sucursal</th><th>Estado</th><th>Red</th><th>Ubicación</th><th>Webview / APK</th><th>Acciones</th></tr></thead><tbody id="devices"><tr><td colspan="7">Cargando…</td></tr></tbody></table></main>
<dialog id="modal"><form method="dialog"><h2 id="modalTitle"></h2><div id="modalContent"></div><div class="actions"><button id="modalSave" value="default">Guardar</button><button class="secondary" value="cancel">Cancelar</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), safeUrl=u=>/^https?:\/\//i.test(String(u))?esc(u):'#';let devices=[];
async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});const d=await r.json();if(!r.ok)throw Error(d.message||'Error');return d}
function network(d){const n=d.network||{};return `${esc(n.type||'N/D')}<br><small>${esc(n.public_ip||'IP pública N/D')} · ${esc(n.local_ip||'IP local N/D')}<br>${esc(n.wifi_ssid||'Sin SSID')} · ${esc(n.signal_dbm??'N/D')} dBm</small>`}
function geo(d){const g=d.geo||{};if(g.latitude==null||g.longitude==null)return '<span class="muted">Sin GPS</span>';const x=`${g.latitude},${g.longitude}`;return `<a target="_blank" rel="noopener" href="https://maps.google.com/?q=${encodeURIComponent(x)}">${esc(x)}</a><br><small>±${esc(g.accuracy_m??'N/D')} m</small>`}
function btn(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function render(){const term=$('search').value.toLowerCase();const rows=devices.filter(d=>`${d.name} ${d.deviceId}`.toLowerCase().includes(term)).map(d=>{const id=encodeURIComponent(d.deviceId);return `<tr><td><strong>${esc(d.name)}</strong><br><small>${esc(d.deviceId)} · v${esc(d.appVersion)}</small></td><td>${esc(d.businessName)}<br><small>${esc(d.location)}</small></td><td class="${d.status==='ONLINE'?'online':'offline'}">${d.status}<br><small>${esc(d.lastPing||'Nunca')}</small></td><td>${network(d)}</td><td>${geo(d)}</td><td><a href="${safeUrl(d.webviewUrl)}" target="_blank" rel="noopener">${esc(d.webviewUrl||'Sin URL')}</a></td><td><div class="actions">${btn('Editar',`editDevice('${id}')`)}${btn('Webview',`webview('${id}')`)}${btn('APK',`apk('${id}')`)}${btn(d.lockState==='locked'?'Desbloquear':'Bloquear',`command('${id}','${d.lockState==='locked'?'unlock_screen':'lock_screen'}')`,'danger')}${btn('Captura',`command('${id}','request_screenshot')`)}${btn('Cámara',`command('${id}','request_camera_snapshot')`)}${d.media?.screenshot?.url?btn('Ver captura',`media(decodeURIComponent('${encodeURIComponent(d.media.screenshot.url)}'))`,'secondary'):''}${d.media?.camera_snapshot?.url?btn('Ver foto',`media(decodeURIComponent('${encodeURIComponent(d.media.camera_snapshot.url)}'))`,'secondary'):''}</div></td></tr>`}).join('');$('devices').innerHTML=rows||'<tr><td colspan="7">No hay dispositivos.</td></tr>';$('count').textContent=`${devices.length} dispositivos`}
async function loadOptions(){const d=await api('/api/v1/fleet/options');for(const [id,items] of Object.entries({business:d.businesses,location:d.locations}))$(id).innerHTML=`<option value="">${id==='business'?'Todos los negocios':'Todas las sucursales'}</option>`+items.filter(Boolean).map(x=>`<option>${esc(x)}</option>`).join('')}
async function loadDevices(){const q=new URLSearchParams();if($('business').value)q.set('business',$('business').value);if($('location').value)q.set('location',$('location').value);try{devices=(await api('/api/v1/kiosks?'+q)).data;render()}catch(e){$('devices').innerHTML=`<tr><td colspan="7">${esc(e.message)}</td></tr>`}}
function open(title,html,save){$('modalTitle').textContent=title;$('modalContent').innerHTML=html;$('modalSave').onclick=async e=>{e.preventDefault();try{await save();$('modal').close();await loadOptions();await loadDevices()}catch(err){alert(err.message)}};$('modal').showModal()}
function editDevice(id){const d=devices.find(x=>x.deviceId===decodeURIComponent(id));open('Asignar negocio y sucursal',`<input id="alias" placeholder="Nombre" value="${esc(d.name)}"><input id="biz" placeholder="Negocio" value="${esc(d.businessName)}"><input id="loc" placeholder="Sucursal" value="${esc(d.location)}">`,()=>api('/api/v1/kiosks/'+id,{method:'PATCH',body:JSON.stringify({alias:$('alias').value,business_name:$('biz').value,location:$('loc').value})}))}
function send(id,type,payload={}){return api('/api/v1/kiosks/'+id+'/command',{method:'POST',body:JSON.stringify({type,payload})})}
async function command(id,type){if(type==='lock_screen'&&!confirm('¿Bloquear esta tableta?'))return;await send(id,type);alert('Comando encolado para el próximo heartbeat.')}
function webview(id){open('Cambiar URL de Webview','<input id="url" type="url" placeholder="https://…" required>',()=>send(id,'set_webview_url',{url:$('url').value}))}
function apk(id){open('Actualizar APK','<input id="url" type="url" placeholder="URL HTTPS del APK" required><input id="version" placeholder="Versión objetivo" required>',()=>send(id,'apk_update',{url:$('url').value,version:$('version').value}))}
function media(url){open('Medio recibido',`<img class="media" src="${safeUrl(url)}" alt="Captura del dispositivo">`,async()=>{})}
$('search').addEventListener('input',render);Promise.all([loadOptions(),loadDevices()]);setInterval(loadDevices,30000);
</script></body></html>
