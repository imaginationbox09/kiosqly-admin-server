<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiosqly Admin Hub</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#13233a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f5f8fc,#eaf1f8);min-height:100vh}.shell{max-width:1500px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;background:#102d4a;color:#fff;border-radius:16px;padding:16px 20px;box-shadow:0 10px 30px #102d4a22}.brand{display:flex;align-items:center;gap:12px}.brand-logo{width:42px;height:42px;object-fit:contain;border-radius:10px;background:#fff;padding:3px}.brand h1{font-size:18px;margin:0;letter-spacing:-.02em}.brand p{margin:3px 0 0;color:#b9cce0;font-size:12px}.logout{background:#ffffff1a;border:1px solid #ffffff33;color:#fff}.toolbar{margin:20px 0 14px;padding:16px;background:#fff;border:1px solid #e4ebf3;border-radius:14px;display:flex;align-items:end;gap:12px;flex-wrap:wrap}.field{display:grid;gap:6px;min-width:190px;flex:1}.field label{font-size:12px;font-weight:700;color:#5c6c80}select,input{min-height:42px;width:100%;padding:10px 12px;border:1px solid #d8e1eb;border-radius:8px;background:#fff;color:#13233a;font:inherit}input:focus,select:focus{outline:2px solid #3383df55;border-color:#3383df}button{padding:10px 13px;border:0;border-radius:8px;background:#1976d2;color:#fff;font:inherit;font-weight:650;cursor:pointer;transition:.15s}button:hover{filter:brightness(.94)}.secondary{background:#eaf0f6;color:#2c4967}.danger{background:#c53427}.count{font-size:13px;color:#607389;padding:12px 4px;white-space:nowrap}.table-card{overflow:auto;background:#fff;border:1px solid #e4ebf3;border-radius:14px;box-shadow:0 8px 24px #24415d0a}table{border-collapse:collapse;width:100%;min-width:1080px}th{padding:14px 16px;background:#f8fafc;color:#52657a;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #e5ebf2}td{padding:16px;border-bottom:1px solid #edf1f5;vertical-align:top;font-size:14px;line-height:1.5}tr:last-child td{border:0}td strong{display:block;color:#142b45;font-size:15px}.sub{color:#64788e;font-size:12px}.online,.offline{font-weight:750}.online{color:#0a8d65}.offline{color:#c53427}.online:before,.offline:before{content:'●';font-size:11px;margin-right:5px}.net,.geo{max-width:180px;overflow-wrap:anywhere}.actions{display:flex;gap:7px;flex-wrap:wrap;min-width:260px}.actions button{padding:7px 10px;font-size:12px}.muted{color:#75869a}a{color:#146bca;font-weight:600;overflow-wrap:anywhere}dialog{width:min(480px,92vw);border:0;border-radius:16px;padding:0;box-shadow:0 18px 60px #10233a55}dialog form{display:grid;gap:14px;padding:22px}dialog h2{margin:0;font-size:19px}dialog input{margin-top:8px}.media{max-width:100%;max-height:70vh;border-radius:8px}dialog::backdrop{background:#10233a88}@media(max-width:680px){.shell{padding:12px}.top{border-radius:12px}.brand p{display:none}.toolbar{display:grid;grid-template-columns:1fr 1fr}.field{min-width:0}.field:last-of-type{grid-column:1/-1}.toolbar>button{grid-column:1/-1}.count{padding:0}.table-card{border-radius:12px}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><img class="brand-logo" src="https://kiosqly.com/wp-content/uploads/2026/07/Logo-2.png" alt="Kiosqly"><div><h1>Kiosqly Admin Hub</h1><p>Control y supervisión de flota</p></div></div><form method="post" action="/logout"><button class="logout">Salir</button></form></header><section class="toolbar"><div class="field"><label for="business">Negocio</label><select id="business"><option value="">Todos los negocios</option></select></div><div class="field"><label for="location">Sucursal</label><select id="location"><option value="">Todas las sucursales</option></select></div><div class="field"><label for="search">Buscar</label><input id="search" placeholder="Nombre o identificador"></div><button onclick="loadDevices()">Aplicar filtros</button><span id="count" class="count"></span></section><main class="table-card"><table><thead><tr><th>Dispositivo</th><th>Negocio y sucursal</th><th>Estado</th><th>Conectividad</th><th>Ubicación</th><th>Webview / APK</th><th>Control remoto</th></tr></thead><tbody id="devices"><tr><td colspan="7">Cargando dispositivos…</td></tr></tbody></table></main></div><dialog id="modal"><form method="dialog"><h2 id="modalTitle"></h2><div id="modalContent"></div><div class="actions"><button id="modalSave" value="default">Guardar</button><button class="secondary" value="cancel">Cancelar</button></div></form></dialog><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), safeUrl=u=>/^https?:\/\//i.test(String(u))?esc(u):'#';let devices=[];
async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});const d=await r.json();if(!r.ok)throw Error(d.message||'Error');return d}
function network(d){const n=d.network||{};return `${esc(n.type||'N/D')}<br><small>${esc(n.public_ip||'IP pública N/D')} · ${esc(n.local_ip||'IP local N/D')}<br>${esc(n.wifi_ssid||'Sin SSID')} · ${esc(n.signal_dbm??'N/D')} dBm</small>`}
function geo(d){const g=d.geo||{};if(g.latitude==null||g.longitude==null)return '<span class="muted">Sin GPS</span>';const x=`${g.latitude},${g.longitude}`;return `<a target="_blank" rel="noopener" href="https://maps.google.com/?q=${encodeURIComponent(x)}">${esc(x)}</a><br><small>±${esc(g.accuracy_m??'N/D')} m</small>`}
function btn(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function render(){const term=$('search').value.toLowerCase();const rows=devices.filter(d=>`${d.name} ${d.deviceId}`.toLowerCase().includes(term)).map(d=>{const id=encodeURIComponent(d.deviceId);return `<tr><td><strong>${esc(d.name)}</strong><br><small>${esc(d.deviceId)} · v${esc(d.appVersion)}</small></td><td>${esc(d.businessName)}<br><small>${esc(d.location)}</small></td><td class="${d.status==='ONLINE'?'online':'offline'}">${d.status}<br><small>${esc(d.lastPing||'Nunca')}</small></td><td>${network(d)}</td><td>${geo(d)}</td><td><a href="${safeUrl(d.webviewUrl)}" target="_blank" rel="noopener">${esc(d.webviewUrl||'Sin URL')}</a></td><td><div class="actions">${btn('Editar',`editDevice('${id}')`)}${btn('Webview',`webview('${id}')`)}${btn('APK',`apk('${id}')`)}${btn(d.lockState==='locked'?'Desbloquear':'Bloquear',`command('${id}','${d.lockState==='locked'?'unlock_screen':'lock_screen'}')`,'danger')}${btn('Captura',`command('${id}','request_screenshot')`)}${btn('Cámara',`command('${id}','request_camera_snapshot')`)}${d.media?.screenshot?.url?btn('Ver captura',`media(decodeURIComponent('${encodeURIComponent(d.media.screenshot.url)}'))`,'secondary'):''}${d.media?.camera_snapshot?.url?btn('Ver foto',`media(decodeURIComponent('${encodeURIComponent(d.media.camera_snapshot.url)}'))`,'secondary'):''}</div></td></tr>`}).join('');$('devices').innerHTML=rows||'<tr><td colspan="7">No hay dispositivos.</td></tr>';$('count').textContent=`${devices.length} dispositivos`}
async function loadOptions(){const d=await api('/api/v1/fleet/options');for(const [id,items] of Object.entries({business:d.businesses,location:d.locations}))$(id).innerHTML=`<option value="">${id==='business'?'Todos los negocios':'Todas las sucursales'}</option>`+items.filter(Boolean).map(x=>`<option>${esc(x)}</option>`).join('')}
async function loadDevices(){const q=new URLSearchParams();if($('business').value)q.set('business',$('business').value);if($('location').value)q.set('location',$('location').value);try{devices=(await api('/api/v1/kiosks?'+q)).data;render()}catch(e){$('devices').innerHTML=`<tr><td colspan="7">${esc(e.message)}</td></tr>`}}
function open(title,html,save){$('modalTitle').textContent=title;$('modalContent').innerHTML=html;$('modalSave').onclick=async e=>{e.preventDefault();try{await save();$('modal').close();await loadOptions();await loadDevices()}catch(err){alert(err.message)}};$('modal').showModal()}
function editDevice(id){const d=devices.find(x=>x.deviceId===decodeURIComponent(id));open('Asignar negocio y sucursal',`<input id="alias" placeholder="Nombre" value="${esc(d.name)}"><input id="biz" placeholder="Negocio" value="${esc(d.businessName)}"><input id="loc" placeholder="Sucursal" value="${esc(d.location)}">`,()=>api('/api/v1/kiosks/'+id,{method:'PATCH',body:JSON.stringify({alias:$('alias').value,business_name:$('biz').value,location:$('loc').value})}))}
function send(id,type,payload={}){return api('/api/v1/kiosks/'+id+'/command',{method:'POST',body:JSON.stringify({type,payload})})}
async function command(id,type){if(type==='lock_screen'&&!confirm('¿Bloquear esta tableta?'))return;await send(id,type);alert('Comando encolado para el próximo heartbeat.')}
function webview(id){open('Cambiar URL de Webview','<input id="url" type="url" placeholder="https://…" required>',()=>send(id,'set_webview_url',{url:$('url').value}))}
function apk(id){open('Actualizar APK','<input id="url" type="url" placeholder="URL HTTPS del APK" required><input id="version" placeholder="Versión objetivo" required>',()=>send(id,'apk_update',{url:$('url').value,version:$('version').value}))}
function media(url){open('Medio recibido',`<img class="media" src="${safeUrl(url)}" alt="Captura del dispositivo">`,async()=>{})}
$('search').addEventListener('input',render);Promise.all([loadOptions(),loadDevices()]);setInterval(loadDevices,30000);
</script></body></html>
