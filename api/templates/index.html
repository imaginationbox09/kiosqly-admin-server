<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiosqly Admin Hub</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#102a43;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#e1efff,transparent 34%),#f3f6fa;min-height:100vh}.shell{max-width:1540px;margin:auto;padding:28px}.top{color:#fff;padding:22px 26px;border-radius:20px;background:linear-gradient(115deg,#0c2742,#164d78);box-shadow:0 18px 38px #0e385a2e;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:15px}.brand-logo{width:52px;height:52px;object-fit:contain;border-radius:14px;background:#fff;padding:4px}.brand h1{font-size:22px;letter-spacing:-.03em;margin:0}.brand p{margin:4px 0 0;color:#c7dceb;font-size:13px}.logout{background:#ffffff18;border:1px solid #ffffff35;color:#fff}.overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:20px 0}.metric{background:#fff;border:1px solid #e0e8f0;border-radius:15px;padding:17px 19px;box-shadow:0 8px 20px #2146640a}.metric small{display:block;text-transform:uppercase;letter-spacing:.07em;color:#718399;font-size:11px;font-weight:750}.metric strong{font-size:25px;letter-spacing:-.04em;color:#143a5c}.metric.live strong{color:#09845f}.metric.alert strong{color:#bd3a32}.toolbar{padding:17px;background:#fff;border:1px solid #e0e8f0;border-radius:16px;display:flex;align-items:end;gap:12px;flex-wrap:wrap}.field{display:grid;gap:6px;min-width:205px;flex:1}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:750;color:#61758d}select,input{width:100%;height:44px;padding:10px 12px;border-radius:9px;border:1px solid #d7e1eb;background:#fbfdff;color:#16334e;font:inherit}select:focus,input:focus{outline:3px solid #2d81d633;border-color:#2d81d6}button{min-height:40px;padding:9px 13px;border:0;border-radius:9px;background:#1976d2;color:#fff;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s,filter .15s}button:hover{filter:brightness(.95);transform:translateY(-1px)}.secondary{background:#e8eff6;color:#274763}.danger{background:#c63a31}.count{font-size:13px;color:#62788f;padding:12px 2px;white-space:nowrap}.table-card{margin-top:15px;overflow:auto;background:#fff;border:1px solid #e0e8f0;border-radius:16px;box-shadow:0 12px 32px #2146640d}table{border-collapse:collapse;width:100%;min-width:1120px}th{padding:14px 18px;background:#f7f9fc;border-bottom:1px solid #e3ebf2;color:#64788e;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em}td{padding:17px 18px;border-bottom:1px solid #edf2f6;vertical-align:top;font-size:13px;line-height:1.5}tr:last-child td{border:0}tr:hover td{background:#fbfdff}td strong{color:#183b5a;font-size:14px}.device-name{display:flex;gap:10px;align-items:start}.device-icon{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#e2effd;color:#1773cf;font-weight:800}.account{font-weight:700}.sub,small{color:#6c8095;font-size:12px}.online,.offline{font-weight:800}.online{color:#09845f}.offline{color:#c63a31}.online:before,.offline:before{content:'●';font-size:10px;margin-right:6px}.actions{display:flex;gap:7px;flex-wrap:wrap;min-width:270px}.actions button{min-height:32px;padding:6px 9px;font-size:12px}.muted{color:#77899b}a{color:#176fc4;font-weight:650;overflow-wrap:anywhere}dialog{width:min(500px,92vw);border:0;border-radius:18px;padding:0;box-shadow:0 20px 70px #102a4355}dialog form{display:grid;gap:14px;padding:24px}dialog h2{margin:0;font-size:20px}.media{max-width:100%;max-height:70vh;border-radius:10px}dialog::backdrop{background:#102a4388}@media(max-width:720px){.shell{padding:14px}.top{border-radius:15px;padding:17px}.brand-logo{width:42px;height:42px}.brand h1{font-size:18px}.brand p{display:none}.overview{grid-template-columns:1fr 1fr}.overview .metric:last-child{grid-column:1/-1}.toolbar{display:grid;grid-template-columns:1fr 1fr}.field{min-width:0}.field:last-of-type,.toolbar>button{grid-column:1/-1}.count{padding:0}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><img class="brand-logo" src="https://kiosqly.com/wp-content/uploads/2026/07/Logo-2.png" alt="Kiosqly"><div><h1>Kiosqly Admin Hub</h1><p>Centro de control y supervisión de flota</p></div></div><form method="post" action="/logout"><button class="logout">Salir</button></form></header><section class="overview"><article class="metric live"><small>Tabletas en línea</small><strong id="onlineCount">—</strong></article><article class="metric alert"><small>Requieren atención</small><strong id="offlineCount">—</strong></article><article class="metric"><small>Negocios administrados</small><strong id="businessCount">—</strong></article></section><section class="toolbar"><div class="field"><label for="business">Negocio</label><select id="business"><option value="">Todos los negocios</option></select></div><div class="field"><label for="location">Sucursal</label><select id="location"><option value="">Todas las sucursales</option></select></div><div class="field"><label for="search">Buscar tableta</label><input id="search" placeholder="Nombre o ID del dispositivo"></div><button onclick="loadDevices()">Aplicar filtros</button><span id="count" class="count"></span></section><main class="table-card"><table><thead><tr><th>Dispositivo</th><th>Negocio y sucursal</th><th>Estado</th><th>Conectividad</th><th>Ubicación</th><th>Webview / APK</th><th>Control remoto</th></tr></thead><tbody id="devices"><tr><td colspan="7">Cargando dispositivos…</td></tr></tbody></table></main></div><dialog id="modal"><form method="dialog"><h2 id="modalTitle"></h2><div id="modalContent"></div><div class="actions"><button id="modalSave" value="default">Guardar cambios</button><button class="secondary" value="cancel">Cancelar</button></div></form></dialog><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), safeUrl=u=>/^https?:\/\//i.test(String(u))?esc(u):'#';let devices=[];
async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});const d=await r.json();if(!r.ok)throw Error(d.message||'Error');return d}
function network(d){const n=d.network||{};return `${esc(n.type||'N/D')}<br><small>${esc(n.public_ip||'IP pública N/D')} · ${esc(n.local_ip||'IP local N/D')}<br>${esc(n.wifi_ssid||'Sin SSID')} · ${esc(n.signal_dbm??'N/D')} dBm</small>`}
function geo(d){const g=d.geo||{};if(g.latitude==null||g.longitude==null)return '<span class="muted">Sin GPS</span>';const x=`${g.latitude},${g.longitude}`;return `<a target="_blank" rel="noopener" href="https://maps.google.com/?q=${encodeURIComponent(x)}">${esc(x)}</a><br><small>±${esc(g.accuracy_m??'N/D')} m</small>`}
function btn(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function render(){
 const term=$('search').value.toLowerCase();
 const filtered=devices.filter(d=>`${d.name} ${d.deviceId}`.toLowerCase().includes(term));
 const rows=filtered.map(d=>{const id=encodeURIComponent(d.deviceId);return `<tr><td><div class="device-name"><span class="device-icon">K</span><div><strong>${esc(d.name)}</strong><br><small>${esc(d.deviceId)} · v${esc(d.appVersion)}</small></div></div></td><td><strong class="account">${esc(d.businessName)}</strong><br><small>${esc(d.location)}</small></td><td class="${d.status==='ONLINE'?'online':'offline'}">${d.status}<br><small>${esc(d.lastPing||'Nunca')}</small></td><td>${network(d)}</td><td>${geo(d)}</td><td><a href="${safeUrl(d.webviewUrl)}" target="_blank" rel="noopener">${esc(d.webviewUrl||'Sin URL')}</a></td><td><div class="actions">${btn('Editar',`editDevice('${id}')`)}${btn('Webview',`webview('${id}')`)}${btn('APK',`apk('${id}')`)}${btn(d.lockState==='locked'?'Desbloquear':'Bloquear',`command('${id}','${d.lockState==='locked'?'unlock_device':'lock_device'}')`,'danger')}${btn('Captura',`command('${id}','take_screenshot')`)}${btn('Cámara',`command('${id}','take_photo')`)}${d.media?.screenshot?(btn('Ver captura',`media(decodeURIComponent('${encodeURIComponent(d.media.screenshot.url||d.media.screenshot.data_url)}'))`,'secondary')):''}${d.media?.camera_snapshot?(btn('Ver foto',`media(decodeURIComponent('${encodeURIComponent(d.media.camera_snapshot.url||d.media.camera_snapshot.data_url)}'))`,'secondary')):''}</div></td></tr>`}).join('');
 $('devices').innerHTML=rows||'<tr><td colspan="7">No hay dispositivos.</td></tr>';
 $('count').textContent=`${filtered.length} de ${devices.length} dispositivos`;
 $('onlineCount').textContent=devices.filter(d=>d.status==='ONLINE').length;
 $('offlineCount').textContent=devices.filter(d=>d.status!=='ONLINE').length;
 $('businessCount').textContent=new Set(devices.map(d=>d.businessName).filter(Boolean)).size;
}
async function loadOptions(){const d=await api('/api/v1/fleet/options');for(const [id,items] of Object.entries({business:d.businesses,location:d.locations}))$(id).innerHTML=`<option value="">${id==='business'?'Todos los negocios':'Todas las sucursales'}</option>`+items.filter(Boolean).map(x=>`<option>${esc(x)}</option>`).join('')}
async function loadDevices(){const q=new URLSearchParams();if($('business').value)q.set('business',$('business').value);if($('location').value)q.set('location',$('location').value);try{devices=(await api('/api/v1/kiosks?'+q)).data;render()}catch(e){$('devices').innerHTML=`<tr><td colspan="7">${esc(e.message)}</td></tr>`}}
function open(title,html,save){$('modalTitle').textContent=title;$('modalContent').innerHTML=html;$('modalSave').onclick=async e=>{e.preventDefault();try{await save();$('modal').close();await loadOptions();await loadDevices()}catch(err){alert(err.message)}};$('modal').showModal()}
function editDevice(id){const d=devices.find(x=>x.deviceId===decodeURIComponent(id));open('Asignar negocio y sucursal',`<input id="alias" placeholder="Nombre" value="${esc(d.name)}"><input id="biz" placeholder="Negocio" value="${esc(d.businessName)}"><input id="loc" placeholder="Sucursal" value="${esc(d.location)}">`,()=>api('/api/v1/kiosks/'+id,{method:'PATCH',body:JSON.stringify({alias:$('alias').value,business_name:$('biz').value,location:$('loc').value})}))}
function send(id,type,payload={}){return api('/api/v1/kiosks/'+id+'/command',{method:'POST',body:JSON.stringify({type,payload})})}
async function command(id,type){if(type==='lock_device'&&!confirm('¿Bloquear esta tableta?'))return;await send(id,type);alert('Comando encolado para el próximo heartbeat.')}
function webview(id){open('Cambiar URL de Webview','<input id="url" type="url" placeholder="https://…" required>',()=>send(id,'set_webview_url',{url:$('url').value}))}
function apk(id){open('Actualizar APK','<input id="url" type="url" placeholder="URL HTTPS del APK" required><input id="version" placeholder="Versión objetivo" required>',()=>send(id,'apk_update',{url:$('url').value,version:$('version').value}))}
function media(url){open('Medio recibido',`<img class="media" src="${safeUrl(url)}" alt="Captura del dispositivo">`,async()=>{})}
$('search').addEventListener('input',render);Promise.all([loadOptions(),loadDevices()]);setInterval(loadDevices,30000);
</script></body></html>
