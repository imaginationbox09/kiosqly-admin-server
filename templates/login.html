<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Kiosqly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; }
        .login-card { width: min(100% - 2rem, 420px); }
    </style>
</head>
<body>
    <main class="card shadow-sm border-0 login-card">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 fw-bold mb-1">Kiosqly</h1>
            <p class="text-muted mb-4">Acceso al panel de administración</p>
            {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}
            <form method="post" autocomplete="on">
                <div class="mb-3">
                    <label class="form-label" for="username">Usuario</label>
                    <input class="form-control" id="username" name="username" type="email" required autofocus autocomplete="username">
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Clave</label>
                    <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
                </div>
                <button class="btn btn-primary w-100" type="submit">Ingresar</button>
            </form>
        </div>
    </main>
</body>
</html>
