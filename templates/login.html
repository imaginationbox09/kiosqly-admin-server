<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosqly Admin Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; background: linear-gradient(145deg, #eef4fb, #dfeaf5); }
        .login-card { width: min(100% - 2rem, 420px); border-radius: 16px; }
    </style>
</head>
<body>
    <main class="card shadow-sm border-0 login-card">
        <div class="card-body p-4 p-md-5">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><img src="https://kiosqly.com/wp-content/uploads/2026/07/Logo-2.png" alt="Kiosqly" style="width:42px;height:42px;object-fit:contain;border-radius:10px;background:#1267d6;padding:3px"><h1 class="h3 fw-bold mb-0">Kiosqly Admin Hub</h1></div>
            <p class="text-muted mb-4">Acceso al panel de administración</p>
            {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}
            <form method="post" autocomplete="on">
                <div class="mb-3">
                    <label class="form-label" for="username">Usuario</label>
                    <input class="form-control" id="username" name="username" type="email" required autofocus autocomplete="username">
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Clave</label>
                    <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
                </div>
                <button class="btn btn-primary w-100" type="submit">Ingresar</button>
            </form>
        </div>
    </main>
</body>
</html>
