<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let currentActiveDeviceId = null;

        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        }

        function removeDropStyle(ev) {
            ev.currentTarget.classList.remove('drag-over');
        }

        function drag(ev) {
            let card = ev.target.closest('.device-item');
            ev.dataTransfer.setData("text/plain", card.getAttribute('data-device-id'));
        }

        function dropDevice(ev, targetGroup) {
            ev.preventDefault();
            let dropzone = ev.currentTarget;
            dropzone.classList.remove('drag-over');
            
            let deviceId = ev.dataTransfer.getData("text/plain");
            if (!deviceId) return;

            assignDeviceGroup(deviceId, targetGroup);
        }

        function assignDeviceGroup(deviceId, targetGroup) {
            let customGroups = JSON.parse(localStorage.getItem('kiosqly_device_groups') || '{}');
            customGroups[deviceId] = targetGroup;
            localStorage.setItem('kiosqly_device_groups', JSON.stringify(customGroups));

            // Mover visualmente la tarjeta a su nuevo contenedor sin recargar bruscamente
            applyClientSideRouting();
        }

        function registerNewGroup(groupName) {
            if (!groupName || !groupName.trim()) return false;
            groupName = groupName.trim();

            let customTabs = JSON.parse(localStorage.getItem('kiosqly_custom_tabs') || '[]');
            if (!customTabs.includes(groupName)) {
                customTabs.push(groupName);
                localStorage.setItem('kiosqly_custom_tabs', JSON.stringify(customTabs));
                return true;
            }
            return false;
        }

        function createGroupDirectly() {
            let input = document.getElementById('quickGroupNameInput');
            let groupName = input.value.trim();
            if (!groupName) {
                alert('Por favor ingresa un nombre válido para el grupo.');
                return;
            }

            if (registerNewGroup(groupName)) {
                input.value = '';
                location.reload();
            } else {
                alert('Este grupo ya existe o ya está registrado.');
            }
        }

        function createNewTabGroupModal() {
            let groupName = document.getElementById('newTabNameInput').value.trim();
            if (!groupName) {
                alert('Por favor ingresa un nombre válido para el grupo.');
                return;
            }

            registerNewGroup(groupName);
            location.reload();
        }

        function editTabName(oldName, event) {
            event.stopPropagation();
            let newName = prompt("Ingresa el nuevo nombre para este repositorio:", oldName);
            if (!newName || !newName.trim() || newName === oldName) return;
            newName = newName.trim();

            let customTabs = JSON.parse(localStorage.getItem('kiosqly_custom_tabs') || '[]');
            let index = customTabs.indexOf(oldName);
            if (index !== -1) {
                customTabs[index] = newName;
                localStorage.setItem('kiosqly_custom_tabs', JSON.stringify(customTabs));

                let customGroups = JSON.parse(localStorage.getItem('kiosqly_device_groups') || '{}');
                for (let devId in customGroups) {
                    if (customGroups[devId] === oldName) {
                        customGroups[devId] = newName;
                    }
                }
                localStorage.setItem('kiosqly_device_groups', JSON.stringify(customGroups));
                location.reload();
            }
        }

        function deleteTabGroup(tabName, event) {
            event.stopPropagation();
            if (!confirm(`¿Estás seguro de eliminar el repositorio "${tabName}"? Las tabletas volverán a su grupo principal.`)) return;

            let customTabs = JSON.parse(localStorage.getItem('kiosqly_custom_tabs') || '[]');
            customTabs = customTabs.filter(t => t !== tabName);
            localStorage.setItem('kiosqly_custom_tabs', JSON.stringify(customTabs));

            let customGroups = JSON.parse(localStorage.getItem('kiosqly_device_groups') || '{}');
            for (let devId in customGroups) {
                if (customGroups[devId] === tabName) {
                    delete customGroups[devId];
                }
            }
            localStorage.setItem('kiosqly_device_groups', JSON.stringify(customGroups));
            location.reload();
        }

        // Motor en Cliente para distribuir tarjetas dinámicamente en sus respectivas pestañas
        function applyClientSideRouting() {
            let customTabs = JSON.parse(localStorage.getItem('kiosqly_custom_tabs') || '[]');
            let deviceGroupsData = JSON.parse(localStorage.getItem('kiosqly_device_groups') || '{}');

            // Recopilar todos los dispositivos físicos que están en la pestaña "Todos"
            let allContainer = document.getElementById('container-all');
            if (!allContainer) return;
            
            let deviceCards = Array.from(allContainer.querySelectorAll('.device-item'));

            // Limpiar contenedores de grupos para redistribuir
            document.querySelectorAll('.dynamic-group-dropzone').forEach(dz => dz.innerHTML = '');

            deviceCards.forEach(card => {
                let devId = card.getAttribute('data-device-id');
                let assignedGroup = deviceGroupsData[devId] || card.getAttribute('data-native-group') || 'Sin Asignar';
                
                // Actualizar etiqueta visual dentro de la tarjeta
                let labelEl = card.querySelector('.group-label-text');
                if (labelEl) labelEl.innerText = assignedGroup;

                // Actualizar el select interno de la tarjeta
                let selectEl = card.querySelector('.device-group-selector');
                if (selectEl) selectEl.value = assignedGroup;

                // Buscar el contenedor correspondiente a este grupo
                let targetDropzone = document.getElementById('dropzone-group-' + CSS.escape(assignedGroup));
                if (targetDropzone) {
                    // Clonar o mover la tarjeta al contenedor de su grupo
                    let clone = card.cloneNode(true);
                    rebindCardEvents(clone);
                    targetDropzone.appendChild(clone);
                }
            });
        }

        function rebindCardEvents(card) {
            // Reasignar eventos de arrastre y selectores en elementos clonados
            card.setAttribute('draggable', 'true');
            card.addEventListener('dragstart', drag);
            
            let selectEl = card.querySelector('.device-group-selector');
            if (selectEl) {
                let devId = card.getAttribute('data-device-id');
                selectEl.onchange = function() { assignDeviceGroup(devId, this.value); };
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            let customTabs = JSON.parse(localStorage.getItem('kiosqly_custom_tabs') || '[]');
            let tabsContainer = document.getElementById('groupTabs');
            let contentContainer = document.getElementById('groupTabsContent');

            // 1. Renderizar pestañas superiores personalizadas dinámicamente si no existen en el DOM estático
            customTabs.forEach((tabName, index) => {
                let safeIdName = tabName.replace(/[^a-zA-Z0-9-_]/g, '_');
                let tabId = 'tab-custom-' + safeIdName;
                
                if (!document.getElementById(tabId + '-btn')) {
                    let li = document.createElement('li');
                    li.className = 'nav-item';
                    li.role = 'presentation';
                    li.innerHTML = `
                        <button class="nav-link" id="${tabId}-btn" data-bs-toggle="tab" data-bs-target="#${tabId}" type="button" role="tab">
                            <i class="fas fa-layer-group text-info me-2"></i><span>${tabName}</span>
                            <span class="ms-2 text-warning" onclick="editTabName('${tabName}', event)" title="Editar nombre"><i class="fas fa-pen fa-xs"></i></span>
                            <span class="ms-1 text-danger" onclick="deleteTabGroup('${tabName}', event)" title="Eliminar pestaña"><i class="fas fa-times fa-xs"></i></span>
                        </button>`;
                    tabsContainer.appendChild(li);

                    let div = document.createElement('div');
                    div.className = 'tab-pane fade';
                    div.id = tabId;
                    div.role = 'tabpanel';
                    div.innerHTML = `
                        <div class="business-group-header d-flex justify-content-between align-items-center">
                            <h4 class="mb-0 fw-bold text-white"><i class="fas fa-folder-open text-info me-2"></i>${tabName}</h4>
                            <span class="small text-muted">Repositorio Personalizado</span>
                        </div>
                        <div class="row dropzone-container dynamic-group-dropzone" id="dropzone-group-${CSS.escape(tabName)}" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropDevice(event, '${tabName}')">
                        </div>`;
                    contentContainer.appendChild(div);
                }
            });

            // 2. Poblar opciones de los selectores en todas las tarjetas
            let deviceGroupsData = JSON.parse(localStorage.getItem('kiosqly_device_groups') || '{}');
            let nativeGroups = ['Sin Asignar'];
            
            document.querySelectorAll('.device-item').forEach(card => {
                let nativeGrp = card.getAttribute('data-native-group');
                if (nativeGrp && !nativeGroups.includes(nativeGrp)) nativeGroups.push(nativeGrp);
            });

            let combinedGroups = [...new Set([...nativeGroups, ...customTabs])];

            document.querySelectorAll('.device-group-selector').forEach(select => {
                let devId = select.getAttribute('data-device-id');
                let currentGroup = deviceGroupsData[devId] || select.getAttribute('data-current-group') || 'Sin Asignar';

                select.innerHTML = '';
                combinedGroups.forEach(groupName => {
                    let opt = document.createElement('option');
                    opt.value = groupName;
                    opt.innerText = groupName;
                    if (groupName === currentGroup) opt.selected = true;
                    select.appendChild(opt);
                });
            });

            // Ejecutar distribución inicial basada en localStorage
            applyClientSideRouting();
        });

        function sendCommand(deviceId, command) {
            let payload = { command: command };
            let urlInput = document.getElementById('url-' + deviceId) || document.getElementById('url-group-' + deviceId);
            let aliasInput = document.getElementById('alias-' + deviceId) || document.getElementById('alias-group-' + deviceId);

            if (command === 'set_url' && urlInput) {
                payload.url = urlInput.value;
            } else if (command === 'set_alias' && aliasInput) {
                payload.alias = aliasInput.value;
            }
            
            fetch('/api/v1/kiosks/' + deviceId + '/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(res => res.json()).then(data => {
                alert('Comando ejecutado con éxito.');
            }).catch(err => alert('Error al enviar el comando.'));
        }

        function openScreenshotModal(deviceId, deviceName) {
            currentActiveDeviceId = deviceId;
            document.getElementById('screenDeviceName').innerText = deviceName;
            var modal = new bootstrap.Modal(document.getElementById('screenshotModal'));
            modal.show();
            requestNewScreenshot();
        }

        function requestNewScreenshot() {
            if (!currentActiveDeviceId) return;
            document.getElementById('screenLoading').style.display = 'block';
            document.getElementById('screenContainer').style.display = 'none';

            fetch('/api/v1/kiosks/' + currentActiveDeviceId + '/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: 'take_screenshot' })
            }).then(() => {
                setTimeout(() => {
                    document.getElementById('deviceScreenshotImg').src = '/api/v1/kiosks/' + currentActiveDeviceId + '/screenshot?t=' + new Date().getTime();
                    document.getElementById('screenLoading').style.display = 'none';
                    document.getElementById('screenContainer').style.display = 'block';
                }, 1800);
            }).catch(() => {
                document.getElementById('screenLoading').style.display = 'none';
                alert('No se pudo establecer conexión visual con el kiosco.');
            });
        }

        function filterDevices() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let items = document.querySelectorAll('.device-item');
            items.forEach(item => {
                let text = item.getAttribute('data-search-text') || '';
                item.style.display = text.includes(input) ? '' : 'none';
            });
        }
    </script>
