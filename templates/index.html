<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel Kiosqly Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --accent-danger: #ef4444;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent-success: #059669;
            --accent-warning: #d97706;
            --accent-danger: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; transition: background 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; background: var(--card-bg); padding: 16px 24px;
            border-radius: 12px; border: 1px solid var(--border-color);
        }
        .logo-area { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 700; }
        
        .controls-header { display: flex; align-items: center; gap: 16px; }
        .theme-switch {
            background: var(--border-color); border: none; cursor: pointer;
            width: 48px; height: 24px; border-radius: 12px; position: relative;
            display: flex; align-items: center; padding: 2px;
        }
        .theme-switch .ball {
            width: 20px; height: 20px; background: white; border-radius: 50%;
            transition: transform 0.3s; transform: translateX(0);
        }
        [data-theme="light"] .theme-switch .ball { transform: translateX(24px); }

        .grid-devices {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;
        }
        .device-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 20px; position: relative;
        }
        .device-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .device-name { font-size: 1.1rem; font-weight: 600; color: var(--primary); }
        
        .info-group { margin-bottom: 10px; font-size: 0.9rem; color: var(--text-muted); }
        .info-group strong { color: var(--text-color); }

        .subscription-box {
            background: rgba(59, 130, 246, 0.1); border: 1px solid var(--border-color);
            padding: 10px; border-radius: 8px; margin-top: 12px; font-size: 0.85rem;
        }
        .countdown { font-weight: 700; color: var(--accent-warning); }

        .btn-action {
            background: var(--primary); color: white; border: none; padding: 8px 12px;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500;
            display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
        }
        .btn-action:hover { background: var(--primary-hover); }

        /* Modal para capturas y fotos */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg); padding: 20px; border-radius: 12px; max-width: 600px; width: 90%;
            text-align: center; border: 1px solid var(--border-color);
        }
        .modal-content img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 12px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <i class="fa-solid fa-tablet-screen-button"></i> Kiosqly Control Panel Enterprise
        </div>
        <div class="controls-header">
            <span id="theme-label"><i class="fa-solid fa-moon"></i></span>
            <button class="theme-switch" onclick="toggleTheme()" id="themeBtn">
                <div class="ball"></div>
            </button>
        </div>
    </header>

    <div class="grid-devices" id="deviceGrid">
        <!-- Tarjeta de Ejemplo de Tableta -->
        <div class="device-card">
            <div class="device-header">
                <span class="device-name"><i class="fa-solid fa-tablet"></i> <span class="dev-title">Recepción Principal (TB305XU)</span></span>
                <span style="color: var(--accent-success); font-size: 0.85rem;"><i class="fa-solid fa-circle" style="font-size: 8px;"></i> Online</span>
            </div>
            <div class="info-group">
                <i class="fa-solid fa-location-dot"></i> <strong>Sucursal:</strong> Brisas del Golf
            </div>
            <div class="info-group">
                <i class="fa-solid fa-network-wired"></i> <strong>IP Local:</strong> 192.168.11.118
            </div>
            
            <!-- Configuración de Suscripción -->
            <div class="info-group">
                <label for="fechaAlta"><strong>Fecha de Alta:</strong></label>
                <input type="date" id="fechaAlta-1" value="2026-08-10" onchange="calcularSuscripcion(1)" style="background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); padding: 4px; border-radius: 4px; margin-left: 5px;">
            </div>

            <div class="subscription-box">
                <div>Ciclo de Suscripción: 30 Días</div>
                <div>Días restantes para cobro: <span class="countdown" id="countdown-1">Calculando...</span></div>
            </div>

            <div style="margin-top: 15px; display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="btn-action" onclick="verMedia('captura', 'https://via.placeholder.com/600x400.png?text=Captura+de+Pantalla+Remota')">
                    <i class="fa-solid fa-desktop"></i> Ver Pantalla
                </button>
                <button class="btn-action" onclick="verMedia('foto', 'https://via.placeholder.com/600x400.png?text=Foto+HD+Camara')">
                    <i class="fa-solid fa-camera"></i> Ver Foto HD
                </button>
            </div>
        </div>
    </div>

    <!-- Modal para ver capturas y fotos -->
    <div class="modal" id="mediaModal" onclick="cerrarModal(event)">
        <div class="modal-content">
            <h3 id="modalTitle">Vista Remota</h3>
            <img id="modalImage" src="" alt="Multimedia de Tableta">
            <br>
            <button class="btn-action" style="background: var(--accent-danger); margin-top: 15px;" onclick="document.getElementById('mediaModal').style.display='none'">Cerrar</button>
        </div>
    </div>

    <script>
        // 1. Control de Modo Oscuro / Claro
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('kiosqly_theme', newTheme);
        }

        // Cargar tema guardado
        const savedTheme = localStorage.getItem('kiosqly_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // 2. Cálculo de Suscripción de 30 días
        function calcularSuscripcion(deviceId) {
            const fechaAltaInput = document.getElementById(`fechaAlta-${deviceId}`).value;
            const countdownEl = document.getElementById(`countdown-${deviceId}`);
            
            if (!fechaAltaInput) return;

            const fechaAlta = new Date(fechaAltaInput);
            const hoy = new Date();
            
            // La suscripción dura 30 días desde la fecha de alta
            const fechaVencimiento = new Date(fechaAlta);
            fechaVencimiento.setDate(fechaVencimiento.getDate() + 30);

            // Calcular diferencia en días
            const diferenciaTiempo = fechaVencimiento.getTime() - hoy.getTime();
            const diasRestantes = Math.ceil(diferenciaTiempo / (1000 * 3600 * 24));

            if (diasRestantes > 0) {
                countdownEl.innerText = `${diasRestantes} días restantes`;
                countdownEl.style.color = diasRestantes <= 5 ? 'var(--accent-danger)' : 'var(--accent-warning)';
            } else {
                countdownEl.innerText = `¡Suscripción Vencida (hace ${Math.abs(diasRestantes)} días)!`;
                countdownEl.style.color = 'var(--accent-danger)';
            }
        }

        // Ejecutar cálculo al iniciar
        calcularSuscripcion(1);

        // 3. Modales para Capturas y Fotos HD
        function verMedia(tipo, url) {
            const modal = document.getElementById('mediaModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalImage = document.getElementById('modalImage');

            modalTitle.innerText = tipo === 'captura' ? 'Vista Remota: Captura de Pantalla' : 'Foto HD de Cámara Remota';
            modalImage.src = url;
            modal.style.display = 'flex';
        }

        function cerrarModal(e) {
            if (e.target.id === 'mediaModal') {
                e.target.style.display = 'none';
            }
        }
    </script>
</body>
</html>
